/* Layout: portada azul con chispas que caen y borde festoneado, cinta de categorías, mosaico de categorías a todo color, tiquete de horario; vistas tipo app con pestañas abajo en celular */
:root{
  --navy:#01244C; --navy-2:#0A3463; --navy-3:#164578;
  --lime:#A2CD3F; --lime-2:#BCE064; --lime-ink:#3F5B08;
  --orange:#F78D1F; --orange-ink:#8A4300;
  --bg:#F4F7F2; --surface:#FFFFFF; --fg:#0B1F38; --muted:#56677C; --line:#DCE3D6;
  --tint-lime:#E8F3CF; --tint-orange:#FDE6CE; --tint-navy:#DDE6F1;
  --paper:#FFFFFF; --paper-ink:#0B1F38;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --max:1180px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#051329; --surface:#0B2142; --fg:#EAF0F7; --muted:#A3B3C8; --line:#1C3A62;
  --tint-lime:#1F3517; --tint-orange:#3B2513; --tint-navy:#14305A; --lime-ink:#C9E785; --orange-ink:#FFB873;
  --paper:#F6F3EA; --paper-ink:#0B1F38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#051329; --surface:#0B2142; --fg:#EAF0F7; --muted:#A3B3C8; --line:#1C3A62;
  --tint-lime:#1F3517; --tint-orange:#3B2513; --tint-navy:#14305A; --lime-ink:#C9E785; --orange-ink:#FFB873;
  --paper:#F6F3EA; --paper-ink:#0B1F38; color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:.005em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";font-size:22px;overflow:hidden;width:1em;flex:none}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:8px}
.stripes-bg{background:repeating-linear-gradient(-38deg,var(--lime) 0 12px,var(--lime-2) 12px 24px)}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;border-bottom:1px solid #ffffff14}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{width:46px;height:46px;border-radius:50%;flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:23px;display:block;line-height:1}
.brand small{display:block;font-size:11px;letter-spacing:.24em;color:#B9C7DA;margin-top:3px}
.nav{margin-left:auto;display:flex;gap:2px}
.nav a{text-decoration:none;padding:9px 15px;border-radius:999px;font-weight:700;font-size:15px;color:#C9D5E4}
.nav a:hover{color:#fff;background:var(--navy-2)}
.nav a[aria-current="page"]{color:var(--navy);background:var(--lime)}
.wa-top{display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#fff;text-decoration:none;font-weight:800;padding:10px 16px;border-radius:999px;font-size:14px;flex:none;box-shadow:0 3px 0 #B95F06}
.wa-top:active{transform:translateY(2px);box-shadow:0 1px 0 #B95F06}
@media (max-width:860px){.nav{display:none}.wa-top{margin-left:auto}}
@media (max-width:380px){.wa-top .t{display:none}}

.draft{background:var(--orange);color:#fff;font-size:13.5px;font-weight:700}
.draft .wrap{padding-block:7px;display:flex;gap:8px;align-items:center;justify-content:center;text-align:center}
.draft .ms{font-size:18px}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:861px){main{padding-bottom:0}}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;border-radius:999px;padding:13px 22px;border:0;cursor:pointer;font-size:16px;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px)}
.btn-lime{background:var(--lime);color:var(--navy);box-shadow:0 4px 0 #6E9420}
.btn-lime:active{box-shadow:0 1px 0 #6E9420}
.btn-orange{background:var(--orange);color:#fff;box-shadow:0 4px 0 #B95F06}
.btn-orange:active{box-shadow:0 1px 0 #B95F06}
.btn-navy{background:var(--navy);color:#fff;box-shadow:0 4px 0 #000E20}
.btn-ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #ffffff55}
.btn-out{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}

/* Portada */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden;isolation:isolate}
#sprinkles{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;padding-block:52px 70px}
.kicker{display:inline-flex;gap:8px;align-items:center;background:#ffffff14;border:1px solid #ffffff26;border-radius:999px;padding:6px 14px 6px 10px;font-size:13.5px;font-weight:700;letter-spacing:.04em}
.kicker .ms{color:var(--lime);font-size:18px}
.hero h1{font-size:clamp(46px,8.4vw,104px);margin:18px 0 18px;line-height:.92}
.hero h1 .l1{display:block}
.hero h1 .l2{display:block;color:var(--lime)}
.hero h1 .l4{display:block;font-size:.5em;margin-top:.22em;color:#fff}
.hero h1 .l3{display:inline-block;font-size:.42em;background:var(--orange);color:#fff;padding:.18em .45em .12em;border-radius:14px;transform:rotate(-3deg);margin-top:.25em;line-height:1.05}
.hero p.lead{color:#C9D5E4;font-size:18px;max-width:44ch}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.status{display:inline-flex;align-items:center;gap:9px;margin-top:22px;font-size:14.5px;font-weight:700;color:#C9D5E4}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.on{background:var(--lime);box-shadow:0 0 0 0 #A2CD3F88;animation:pulse 2s infinite}
.dot.off{background:var(--orange)}
@keyframes pulse{70%{box-shadow:0 0 0 9px #A2CD3F00}100%{box-shadow:0 0 0 0 #A2CD3F00}}
.badge-wrap{justify-self:center;position:relative;width:min(380px,80vw);aspect-ratio:1;max-width:100%}
.badge-ring{position:absolute;inset:0;border-radius:50%;animation:spin 40s linear infinite}
.badge-ring svg{width:100%;height:100%}
.badge-ring text{font-family:var(--f-display);font-size:13.5px;fill:var(--lime)}
.badge-wrap img{position:absolute;inset:13%;width:74%;height:74%;border-radius:50%;box-shadow:0 0 0 8px var(--lime),0 0 0 16px var(--navy-2)}
.sticker{position:absolute;right:-2%;bottom:6%;background:var(--orange);color:#fff;font-family:var(--f-display);text-align:center;width:31%;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;transform:rotate(12deg);box-shadow:0 6px 0 #B95F06;line-height:1}
.sticker small{font-family:var(--f-body);font-weight:800;font-size:clamp(10px,1.2vw,12px);letter-spacing:.1em;display:block;margin-bottom:2px}
.sticker b{font-weight:400;font-size:clamp(22px,3vw,34px)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:780px){.hero .wrap{grid-template-columns:1fr;padding-block:30px 56px;gap:18px}.badge-wrap{order:-1;width:210px}}

.scallop{height:22px;background:radial-gradient(circle at 11px 0,var(--navy) 11px,transparent 11.5px) 0 0/22px 22px repeat-x;margin-top:-1px}
.scallop.lime{background-image:radial-gradient(circle at 11px 0,var(--lime) 11px,transparent 11.5px)}

/* Cinta */
.tape-wrap{overflow:hidden;padding-block:18px 8px}
.tape{background:var(--lime);color:var(--navy);transform:rotate(-1.6deg);margin-inline:-24px;border-block:3px solid var(--navy)}
.tape .track{display:flex;width:max-content;animation:slide 32s linear infinite}
.tape span{font-family:var(--f-display);font-size:22px;padding:10px 0;white-space:nowrap;display:inline-flex;align-items:center}
.tape span i{font-style:normal;color:var(--orange);margin:0 18px;font-size:18px}
@keyframes slide{to{transform:translateX(-50%)}}

section.block{padding-block:48px 8px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(32px,4.8vw,48px)}
.sec-head h2 em{font-style:normal;color:var(--orange)}
.sec-head p{color:var(--muted);margin-top:8px;max-width:56ch;font-size:17px}
.link-more{display:inline-flex;align-items:center;gap:4px;font-weight:800;text-decoration:none;font-size:15.5px;border-bottom:3px solid var(--lime);padding-bottom:2px}

/* Mosaico de categorías */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media (max-width:1100px){.cats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:780px){.cats{grid-template-columns:repeat(2,1fr);gap:12px}.cat{min-height:150px;padding:14px}.cat h3{font-size:20px}.cat p{font-size:13px}.cat .big{font-size:92px}}
.cat{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:170px;padding-top:54px!important;text-decoration:none;border-radius:var(--r);padding:18px;transition:transform .18s cubic-bezier(.3,1.6,.6,1)}
.cat:hover{transform:translateY(-4px) rotate(-1deg)}
.cat .big{position:absolute;right:-10px;top:-12px;font-size:118px;width:auto;opacity:.22;transform:rotate(-12deg);transition:transform .25s}
.cat:hover .big{transform:rotate(0deg) scale(1.06)}
.cat.has-pics{padding-top:158px!important}
.c-paper .pic{box-shadow:0 0 0 2px var(--line),0 6px 14px #0000001a}
.cat .pics{position:absolute;left:0;right:0;top:48px;height:118px;pointer-events:none}
.cat .pic{position:absolute;top:0;width:96px;height:96px;border-radius:20px;background:#fff;box-shadow:0 6px 14px #00000026;overflow:hidden;transition:transform .25s cubic-bezier(.3,1.6,.6,1)}
.cat .pic img{width:100%;height:100%;object-fit:contain;padding:6px;display:block}
.cat .pic.p0{left:50%;margin-left:-48px;z-index:2;transform:translateY(4px)}
.cat .pic.p1{left:50%;margin-left:-112px;transform:rotate(-12deg) scale(.86)}
.cat .pic.p2{left:50%;margin-left:16px;transform:rotate(12deg) scale(.86)}
.cat:hover .pic.p1{transform:rotate(-16deg) scale(.88) translateX(-6px)}
.cat:hover .pic.p2{transform:rotate(16deg) scale(.88) translateX(6px)}
.cat:not(.has-pics){min-height:260px}
@media (max-width:780px){.cat.has-pics{padding-top:126px!important}.cat .pics{top:36px}.cat .pic{width:76px;height:76px;border-radius:16px}.cat .pic.p0{margin-left:-38px}.cat .pic.p1{margin-left:-86px}.cat .pic.p2{margin-left:10px}.cat:not(.has-pics){min-height:220px}}
.empty-cat{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:var(--surface);border-radius:var(--r);padding:28px;box-shadow:inset 0 0 0 2px var(--line);text-align:left}
.empty-cat .ico{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:var(--tint-orange);color:var(--orange-ink)}
.empty-cat .ico .ms{font-size:46px}
.empty-cat h3{font-size:28px;margin-bottom:6px}
.empty-cat p{color:var(--muted);max-width:56ch;margin-bottom:16px}
@media (max-width:560px){.empty-cat{grid-template-columns:1fr;text-align:center;justify-items:center}}
.cat h3{font-size:24px;position:relative}
.cat p{font-size:14px;position:relative;opacity:.85;font-weight:600}
.cat .n{position:absolute;top:14px;left:14px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:#ffffff33}
.c-navy{background:var(--navy);color:#fff}
.c-lime{background:var(--lime);color:var(--navy)}
.c-lime .n{background:#01244C1A}
.c-orange{background:var(--orange);color:#fff}
.c-paper{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.c-paper .big{color:var(--lime-ink)}
.c-paper .n{background:var(--tint-lime);color:var(--lime-ink)}

/* Por qué */
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.why>div{background:var(--surface);border-radius:var(--r);padding:22px;box-shadow:inset 0 0 0 2px var(--line)}
.why .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;margin-bottom:14px}
.why .ico .ms{font-size:30px}
.why h3{font-size:24px;margin-bottom:6px}
.why p{color:var(--muted)}
@media (max-width:780px){.why{grid-template-columns:1fr}}
.t-lime{background:var(--tint-lime);color:var(--lime-ink)}
.t-orange{background:var(--tint-orange);color:var(--orange-ink)}
.t-navy{background:var(--tint-navy);color:var(--fg)}

/* Visita + tiquete */
.visit{margin-top:56px;background:var(--lime);color:var(--navy);position:relative}
.visit .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding-block:44px 52px}
.visit h2{font-size:clamp(34px,5vw,54px);margin-bottom:12px}
.visit p.addr{font-size:18px;font-weight:700;max-width:40ch}
.visit .actions{margin-top:22px}
@media (max-width:780px){.visit .wrap{grid-template-columns:1fr}}
.ticket-wrap{filter:drop-shadow(0 12px 18px #01244C33);transform:rotate(1.5deg);max-width:420px;justify-self:center;width:100%}
.ticket{background:var(--paper);color:var(--paper-ink);border-radius:6px 6px 0 0;padding:22px 22px 30px;position:relative;
  -webkit-mask:radial-gradient(circle 8px at 50% 100%,#0000 98%,#000) 0 0/16px 100% repeat-x;mask:radial-gradient(circle 8px at 50% 100%,#0000 98%,#000) bottom/16px 100% repeat-x}
.ticket .th{text-align:center;font-family:var(--f-display);font-size:24px}
.ticket .ts{text-align:center;font-size:12px;letter-spacing:.2em;color:#56677C;margin-bottom:12px}
.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.hours td{padding:9px 0;border-top:2px dashed #C9D2C0}
.hours td:last-child{text-align:right;font-weight:800}
.hours tr.today td{color:#3F5B08}
.ticket .foot{margin-top:12px;text-align:center;font-size:13px;font-weight:700;color:#56677C}

/* Catálogo */
.page-hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.page-hero .wrap{padding-block:30px 34px;position:relative}
.page-hero .shell{position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;opacity:.16}
.page-hero h1{font-size:clamp(38px,6vw,64px)}
.page-hero p{color:#C9D5E4;margin-top:8px;max-width:60ch;font-size:17px}
.crumbs{display:flex;gap:4px;align-items:center;font-size:14px;font-weight:700;color:#B9C7DA;flex-wrap:wrap;margin-bottom:10px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:#fff}
.crumbs .ms{font-size:18px}
.search{position:relative;margin-top:22px;max-width:600px;display:block}
.search input{width:100%;font:inherit;font-size:16.5px;font-weight:600;padding:15px 18px 15px 50px;border-radius:999px;border:0;background:#fff;color:#0B1F38;box-shadow:0 4px 0 var(--lime)}
.search input::placeholder{color:#7A8899}
.search input:focus{outline:none;box-shadow:0 4px 0 var(--orange)}
.search .ms{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--navy)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-size:14.5px;font-weight:700;cursor:pointer}
.chip:hover{border-color:var(--lime)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.count{font-size:14.5px;font-weight:700;color:var(--muted);margin:16px 0 12px;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:16px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.prod .info{padding:12px}.prod h3{font-size:15px}.ph .ms{font-size:56px}.price-tag{font-size:16px;right:8px}}
.prod{display:flex;flex-direction:column;text-decoration:none;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);transition:transform .18s cubic-bezier(.3,1.6,.6,1),box-shadow .18s}
.prod:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 2px var(--lime),0 10px 20px #01244C1A}
.ph{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-38deg,#ffffff00 0 14px,#ffffff1f 14px 28px)}
.ph .ms{font-size:76px;width:auto;position:relative;filter:drop-shadow(0 4px 0 #00000022)}
.ph .tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:800;letter-spacing:.06em;background:#ffffffd9;color:#0B1F38;padding:3px 9px;border-radius:999px}
.ph.c-navy .ms{color:var(--lime)}
.ph.c-lime .ms{color:var(--navy)}
.ph.c-orange .ms{color:#fff}
.ph.c-paper{background:var(--tint-lime)}
.ph.photo{background:#fff}
.ph.photo::before{display:none}

function crNow(){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"America/Costa_Rica",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date());
  const g=t=>parts.find(p=>p.type===t).value;
  return {day:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")),min:(+g("hour")%24)*60+ +g("minute")};
}
function estado(){
  const {day,min}=crNow();
  const h=TIENDA.horario.find(x=>x.dias.includes(day));
  const idx=TIENDA.horario.indexOf(h);
  if(h.cerrado) return {on:false,txt:"Hoy domingo cerramos · abrimos el lunes a las 8:00 a. m.",today:idx};
  if(min>=h.a&&min<h.c) return {on:true,txt:"Abierto ahora · cerramos a las "+(h.c===1110?"6:30 p. m.":"6:00 p. m."),today:idx};
  if(min<h.a) return {on:false,txt:"Cerrado ahora · abrimos hoy a las 8:00 a. m.",today:idx};
  return {on:false,txt:"Cerrado ahora · abrimos "+(day===6?"el lunes":"mañana")+" a las 8:00 a. m.",today:idx};

    <div style="height:56px"></div>${footer()}</div>`;
  }
  return `<div class="view">${navHero(`<div class="crumbs"><a href="#catalogo">Catálogo</a><span class="ms" aria-hidden="true">chevron_right</span><span>Navidad</span></div>
    <h1>Navidad en La Tortuga</h1><p>Productos de temporada para tus postres y regalos navideños. Escogé una categoría.</p>`)}
  <div class="wrap">${gs.length?`<div class="cats nav-cats" style="margin-top:28px">${gs.map(navCard).join("")}</div>`:`<div class="empty-cat" style="margin-top:28px"><span class="ico"><span class="ms" aria-hidden="true">park</span></span><div><h3>Muy pronto</h3><p>Estamos preparando los productos navideños.</p></div></div>`}</div>
  <div style="height:56px"></div>${footer()}</div>`;
}

/* ---------- Mi lista ---------- */
let LISTA={};
try{LISTA=JSON.parse(localStorage.getItem("tortuga-lista")||"{}")||{}}catch(e){LISTA={}}
for(const k in LISTA) if(!PRODUCTOS.some(p=>p.id===k)||!(LISTA[k]>0)) delete LISTA[k];
const guardar=()=>{try{localStorage.setItem("tortuga-lista",JSON.stringify(LISTA))}catch(e){}};
const PRECIO_BOLSA=50;
let COLORES={};try{COLORES=JSON.parse(localStorage.getItem("tortuga-colores")||"{}")||{}}catch(e){COLORES={}}
const pideColor=p=>p.c==="colorantes";
let BOLSA=false;try{BOLSA=localStorage.getItem("tortuga-bolsa")==="1"}catch(e){}
const prod=id=>PRODUCTOS.find(p=>p.id===id);
const unit=(p,q)=>p.bulk&&q>=p.bulk.n?p.bulk.pr:p.pr;
const bulkTxt=p=>p.bulk?`${p.bulk.n} o más: ${crc(p.bulk.pr)} c/u`:"";
function addBtn(p,mini){
  const q=LISTA[p.id]||0;
  if(mini) return q?`<div class="add-mini on" data-for="${p.id}"><button type="button" data-dec="${p.id}" aria-label="Quitar uno">−</button><span>${q}</span><button type="button" data-inc="${p.id}" aria-label="Agregar uno">+</button></div>`
                   :`<div class="add-mini" data-for="${p.id}"><button type="button" class="plus" data-inc="${p.id}" aria-label="Agregar ${esc(p.n)} a mi lista">+</button></div>`;
  return q?`<div class="stepper" data-for="${p.id}"><button type="button" data-dec="${p.id}" aria-label="Quitar uno">−</button><span>${q} en tu lista</span><button type="button" data-inc="${p.id}" aria-label="Agregar uno">+</button></div>`
          :`<button type="button" class="btn btn-orange" data-inc="${p.id}" data-for="${p.id}"><span class="ms" aria-hidden="true">add_shopping_cart</span>Agregar a mi lista</button>`;
}
function resumen(){
  let n=0,u=0,total=0,sinPrecio=0;
  for(const [id,q] of Object.entries(LISTA)){const p=prod(id);if(!p)continue;n++;u+=q;if(p.pr)total+=unit(p,q)*q;else sinPrecio++}
  const bolsa=BOLSA&&u>0;if(bolsa)total+=PRECIO_BOLSA;
  return {n,u,total,sinPrecio,bolsa};
}
function syncLista(){
  const r=resumen();const b=$("#badge");b.hidden=!r.u;b.textContent=r.u;
  const bar=$("#listbar");bar.hidden=!r.u||document.body.classList.contains("on-lista");
  $("#lbtxt").textContent=`${r.u} ${r.u===1?"producto":"productos"}${r.total?" · "+crc(r.total)+(r.sinPrecio?" + por confirmar":""):""}`;
  document.body.classList.toggle("has-bar",!bar.hidden);
}
function refrescar(id){
  document.querySelectorAll(`[data-for="${id}"]`).forEach(el=>{const p=prod(id);const mini=el.classList.contains("add-mini");el.outerHTML=addBtn(p,mini)});
  guardar();syncLista();
  if(document.body.classList.contains("on-lista")){const y=scrollY;app.innerHTML=vLista();scrollTo(0,y)}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-inc],[data-dec],[data-del],#vaciar,#enviar");if(!t)return;
  e.preventDefault();e.stopPropagation();
  if(t.dataset.inc){const id=t.dataset.inc;LISTA[id]=Math.min((LISTA[id]||0)+(+t.dataset.step||1),999);refrescar(id);toast(LISTA[id]===1?"Agregado a tu lista":"Cantidad actualizada")}
  else if(t.dataset.dec){const id=t.dataset.dec;LISTA[id]=(LISTA[id]||0)-1;if(LISTA[id]<=0)delete LISTA[id];refrescar(id)}
  else if(t.dataset.del){const id=t.dataset.del;delete LISTA[id];refrescar(id)}
  else if(t.id==="vaciar"){if(t.dataset.ok){LISTA={};guardar();syncLista();app.innerHTML=vLista()}else{t.dataset.ok="1";t.textContent="Tocá otra vez para vaciar";setTimeout(()=>{if(t.isConnected){delete t.dataset.ok;t.textContent="Vaciar lista"}},3000)}}
  else if(t.id==="enviar"){const a=document.createElement("a");a.href=t.dataset.href;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}
},true);
let tt;function toast(m){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),1600)}
function mensajeLista(nombre){
  const r=resumen();const lines=["Hola, vi el catálogo de La Tortuga y quiero consultar este pedido:",""];
  for(const [id,q] of Object.entries(LISTA)){const p=prod(id);if(!p)continue;lines.push(`• ${q} × ${p.c==="navidad"?"":p.m+" "}${p.n} (${p.p})${pideColor(p)?" – color: "+((COLORES[id]||"").trim()||"por definir"):""}${p.pr?" – "+crc(unit(p,q)*q)+(p.bulk&&q>=p.bulk.n?" (precio por mayor, "+crc(p.bulk.pr)+" c/u)":""):" – precio por confirmar"}`)}
  if(r.bolsa) lines.push(`• Bolsa – ${crc(PRECIO_BOLSA)}`);
  lines.push("");
  if(r.total) lines.push(`Total aproximado: ${crc(r.total)}${r.sinPrecio?" + productos por confirmar":""}`);
  if(nombre) lines.push(`A nombre de: ${nombre}`);
  lines.push("¿Me confirman si está todo disponible? Gracias.");
  return lines.join("\n");
}
function vLista(){
  const r=resumen();
  const items=Object.entries(LISTA).map(([id,q])=>{const p=prod(id);if(!p)return"";const c=cat(p.c);
    return `<li class="li"><a class="li-img" href="#p-${p.id}">${p.img?`<img src="${p.img}" alt="">`:`<span class="ms" aria-hidden="true">${c.ic}</span>`}</a>
    <div class="li-info"><span class="cn">${esc(p.m)}</span><a href="#p-${p.id}"><b>${esc(p.n)}</b></a><span class="pres">${esc(p.p)} · ${p.pr?crc(unit(p,q))+" c/u":"precio por confirmar"}</span>${p.bulk?(q>=p.bulk.n?`<span class="bulk-ok"><span class="ms" aria-hidden="true">sell</span>Precio por mayor aplicado</span>`:`<span class="bulk-hint">Llevando ${p.bulk.n} o más: ${crc(p.bulk.pr)} c/u (te faltan ${p.bulk.n-q})</span>`):""}
    ${pideColor(p)?`<label class="color-f" for="col-${p.id}"><span class="ms" aria-hidden="true">palette</span><input id="col-${p.id}" type="text" data-color="${p.id}" maxlength="80" placeholder="¿Qué color? Ej: rojo y negro" value="${esc(COLORES[p.id]||"")}"></label>`:""}</div>
    <div class="li-qty"><div class="stepper sm"><button type="button" data-dec="${p.id}" aria-label="Quitar uno">−</button><span>${q}</span><button type="button" data-inc="${p.id}" aria-label="Agregar uno">+</button></div>
    <span class="li-sub">${p.pr?crc(unit(p,q)*q):"—"}</span><button type="button" class="li-del" data-del="${p.id}" aria-label="Quitar ${esc(p.n)}"><span class="ms" aria-hidden="true">delete</span></button></div></li>`}).join("");
  let nombre="";try{nombre=sessionStorage.getItem("tortuga-nombre")||""}catch(e){}
  return `<div class="view">${pageHero(`<h1>Mi lista</h1><p>Armá tu pedido y mandalo por WhatsApp. La tienda te confirma disponibilidad y el total. No se cobra nada en línea.</p>`)}
  <div class="wrap">${r.u?`<div class="lista">
    <ul class="items">${items}</ul>
    <aside class="card resumen">
      <h2><span class="ms" aria-hidden="true">receipt_long</span>Resumen</h2>
      <div class="rrow"><span>Productos</span><b>${r.u}</b></div>
      <label class="check" for="bolsa"><input id="bolsa" type="checkbox" ${BOLSA?"checked":""}><span class="box" aria-hidden="true"></span><span><b>Quiero bolsa</b><small>Se suma ${crc(PRECIO_BOLSA)} al pedido</small></span></label>
      <div class="rrow big"><span>Total aproximado</span><b>${r.total?crc(r.total):"Por confirmar"}</b></div>
      ${r.sinPrecio?`<p class="note"><span class="ms" aria-hidden="true">info</span>${r.sinPrecio===1?"1 producto no tiene":r.sinPrecio+" productos no tienen"} precio en el catálogo; la tienda te lo confirma.</p>`:""}
      <label class="field" for="nombre">Tu nombre (opcional)<input id="nombre" type="text" autocomplete="name" placeholder="Ej: María" value="${esc(nombre)}"></label>
      <button type="button" class="btn btn-orange wide" id="enviar" data-href="${wa(mensajeLista(nombre))}"><span class="ms" aria-hidden="true">chat</span>Enviar pedido por WhatsApp</button>
      <p class="note"><span class="ms" aria-hidden="true">lock</span>Se abre WhatsApp con el mensaje listo; vos decidís si lo enviás.</p>
      <button type="button" class="link-btn" id="vaciar">Vaciar lista</button>
    </aside></div>`
  :`<div class="empty-cat" style="margin-top:28px"><span class="ico"><span class="ms" aria-hidden="true">shopping_basket</span></span><div><h3>Tu lista está vacía</h3><p>En el catálogo, tocá el <b>+</b> de cada producto para agregarlo. Después volvés aquí y mandás todo junto por WhatsApp.</p><a class="btn btn-lime" href="#catalogo"><span class="ms" aria-hidden="true">cake</span>Ir al catálogo</a></div></div>`}
  </div><div style="height:56px"></div>${footer()}</div>`;
}
document.addEventListener("change",e=>{if(e.target.id==="bolsa"){BOLSA=e.target.checked;try{localStorage.setItem("tortuga-bolsa",BOLSA?"1":"0")}catch(x){}const y=scrollY;app.innerHTML=vLista();scrollTo(0,y);syncLista();const c=$("#bolsa");if(c)c.focus()}});
document.addEventListener("input",e=>{const c=e.target.dataset&&e.target.dataset.color;if(c){COLORES[c]=e.target.value;try{localStorage.setItem("tortuga-colores",JSON.stringify(COLORES))}catch(x){}let n="";try{n=sessionStorage.getItem("tortuga-nombre")||""}catch(x){}const b=$("#enviar");if(b)b.dataset.href=wa(mensajeLista(n.trim()))}});
document.addEventListener("input",e=>{if(e.target.id==="nombre"){try{sessionStorage.setItem("tortuga-nombre",e.target.value)}catch(x){}const b=$("#enviar");if(b)b.dataset.href=wa(mensajeLista(e.target.value.trim()))}});

let raf=0;
function sprinkles(){
  cancelAnimationFrame(raf);
  const cv=$("#sprinkles"); if(!cv) return;
  const ctx=cv.getContext("2d"); const cols=["#A2CD3F","#F78D1F","#FFFFFF","#BCE064","#5B8BC9","#F9B36B"];
  let W,H,ps=[];
  function size(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    const n=Math.round(W*H/9000);ps=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,a:Math.random()*Math.PI,va:(Math.random()-.5)*.02,v:.25+Math.random()*.5,l:8+Math.random()*7,c:cols[Math.random()*cols.length|0],o:.35+Math.random()*.5}))}
  function draw(){ctx.clearRect(0,0,W,H);ctx.lineCap="round";ctx.lineWidth=4;
    for(const p of ps){ctx.globalAlpha=p.o;ctx.strokeStyle=p.c;ctx.beginPath();ctx.moveTo(p.x-Math.cos(p.a)*p.l/2,p.y-Math.sin(p.a)*p.l/2);ctx.lineTo(p.x+Math.cos(p.a)*p.l/2,p.y+Math.sin(p.a)*p.l/2);ctx.stroke()}ctx.globalAlpha=1}
  function tick(){for(const p of ps){p.y+=p.v;p.a+=p.va;if(p.y>H+10){p.y=-10;p.x=Math.random()*W}}draw();raf=requestAnimationFrame(tick)}
  size();draw();if(!RM)raf=requestAnimationFrame(tick);
  new ResizeObserver(()=>{size();draw()}).observe(cv);
}

function route(){
  const h=(location.hash||"#inicio").slice(1);
  let html,section="inicio",catId=null,isList=false;
  if(h==="catalogo"){section="catalogo";isList=true;html=vCatalogo(null)}
  else if(h==="c-navidad"&&navOn()){section="catalogo";html=vNavidad()}
  else if(h.startsWith("c-")){section="catalogo";catId=h.slice(2);isList=!!cat(catId);filtro.sub="todas";html=vCatalogo(catId)}
  else if(h.startsWith("p-")){section="catalogo";html=vProducto(h.slice(2))}
  else if(h==="nosotros"){section="nosotros";html=vNosotros()}
  else if(h==="visitanos"){section="visitanos";html=vVisitanos()}
  else if(h==="lista"){section="lista";html=vLista()}
  else if(h==="navidad"&&navOn()){section="catalogo";html=vNavidad()}
  else if(h.startsWith("navidad-")&&navOn()){section="catalogo";html=vNavidad(h.slice(8))}
  else html=vInicio();
  app.innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(a=>{if(a.dataset.nav===section)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(isList) wireList(catId);
  document.body.classList.toggle("on-lista",section==="lista");syncLista();
  sprinkles();
  const cp=$("#copyTel"); if(cp) cp.onclick=()=>{
    const done=()=>{cp.textContent="Copiado";setTimeout(()=>cp.textContent="Copiar",1600)};
    const sel=()=>{const r=document.createRange();r.selectNodeContents($("#tel"));const s=getSelection();s.removeAllRanges();s.addRange(r)};
    try{navigator.clipboard.writeText(TIENDA.telefono).then(done,sel)}catch(e){sel()}
  };
}
function wireList(catId){
  pintarGrid(catId);
  const q=$("#q");
  q.addEventListener("input",()=>{const had=!!document.querySelector(".wrap > .cats");filtro.q=q.value;
    if(!catId&&had&&filtro.q){const pos=q.selectionStart;route();const n=$("#q");n.focus();n.setSelectionRange(pos,pos);return}
    pintarGrid(catId)});
  document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.cat){filtro.cat=b.dataset.cat;route()}
    else{filtro.sub=b.dataset.sub;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));pintarGrid(catId)}
  }));
}
let navDepth=0,goingBack=false;
document.addEventListener("click",e=>{const b=e.target.closest("[data-back]");if(!b)return;if(navDepth>0){goingBack=true;history.back()}else{location.hash=b.dataset.back}});
window.addEventListener("hashchange",()=>{if(goingBack){navDepth=Math.max(0,navDepth-1);goingBack=false}else navDepth++;if(location.hash==="#catalogo"){filtro.q="";filtro.cat="todas"}route();window.scrollTo(0,0)});
route();
</script>
